global:
  smtp_smarthost: smtp.gmail.com:587
  smtp_auth_password_file: '/etc/alertmanager/smtp_auth_password'
  smtp_from: your_mail@gmail.com
  smtp_auth_username: your_mail@gmail.com
  smtp_auth_identity: your_mail@gmail.com

templates:
  - '/etc/alertmanager/templates/custom-summary.tmpl'
  - '/etc/alertmanager/templates/severity-summary.tmpl'

route:
  receiver: "team-X-mail"
  group_by: [alertname]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  routes:
    # Critical alerts: shorter repeat interval, sent to the webhook receiver.
    - receiver: "team-X-webhook"
      matchers:
        - severity="critical"
      group_by: [alertname, instance]
      repeat_interval: 30m
    # Warning alerts: sent by mail, muted outside business hours.
    - receiver: "team-X-mail"
      matchers:
        - severity="warning"
      mute_time_intervals:
        - outside-business-hours

# Warning alerts are suppressed while a critical alert with the same
# alertname and instance is firing.
inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname, instance]

time_intervals:
  - name: outside-business-hours
    time_intervals:
      - weekdays: ['monday:friday']
        times:
          - start_time: '00:00'
            end_time: '09:00'
          - start_time: '17:00'
            end_time: '24:00'
      - weekdays: ['saturday', 'sunday']

receivers:
  - name: "team-X-webhook"
    webhook_configs:
      - url: "https://your_webhook_url"
        send_resolved: true
  - name: 'team-X-mail'
    email_configs:
      - send_resolved: true
        to: your_mail@gmail.com
        html: ''
        text: '{{ template "custom.summary" . }}'